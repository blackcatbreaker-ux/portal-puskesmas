<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Utama</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; color: #333; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-decoration: none; color: #0066cc; font-weight: bold; }
    .card:hover { background: #e6f0fa; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to My Portal</h1>
    <div class="grid">
      <a href="https://github.com" class="card" target="_blank">GitHub</a>
      <a href="https://google.com" class="card" target="_blank">Google Search</a>
      <a href="https://news.ycombinator.com" class="card" target="_blank">Tech News</a>
    </div>
  </div>
</body>
</html>
